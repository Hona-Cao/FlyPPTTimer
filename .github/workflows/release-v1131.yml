name: Publish FlyPPTTimer v1.13.1
on:
  push:
    branches: [publish/v1.13.1]
    paths: [.github/workflows/release-v1131.yml]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust and Windows SDK
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter rc.exe -Recurse | Where-Object FullName -Match '\\x64\\rc.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          $rc.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-v1131-${{ hashFiles('Cargo.lock') }}
      - name: Prepare disposable documentation renderer
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile doc-font.otf
          python scripts/prepare-doc-capture.py
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { throw 'Documentation renderer build failed' }
      - name: Render current GUI for documentation
        run: |
          $exe = (Resolve-Path target/debug/FlyPPTTimer.exe).Path
          foreach ($theme in @('light','dark')) {
            $env:FLYPPT_CAPTURE_THEME = $theme
            foreach ($view in @('settings','windows')) {
              $out = Join-Path $PWD "captures/$theme/$view"
              New-Item -ItemType Directory -Force $out | Out-Null
              $p = Start-Process $exe -ArgumentList "--capture-$view",$out -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "Capture failed: $theme/$view" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: v1131-release-desktop-cjk
          path: captures/**/*.png
          retention-days: 7
