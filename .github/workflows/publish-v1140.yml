name: Publish FlyPPTTimer v1.14.0
on:
  push:
    branches: [release/v1.14.0]
    paths: [.github/workflows/publish-v1140.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v1140
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed documentation
        shell: python
        run: |
          from pathlib import Path
          import base64, lzma, subprocess
          chunks = [Path(f'.github/v1140-docs-{i}.b64') for i in range(4)]
          if chunks[0].exists():
              patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks)))
              subprocess.run(['git', 'apply', '--whitespace=nowarn', '-'], input=patch, check=True)
              for p in chunks:
                  p.unlink()
      - uses: actions/download-artifact@v4
        with:
          name: v1140-doc-captures
          run-id: 34953602785
          github-token: ${{ github.token }}
          path: desktop-captures
      - name: Select current desktop GUI
        run: python scripts/select-doc-captures.py desktop-captures
      - name: Browser renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Mobile GUI and focused interaction tests
        run: |
          python scripts/capture-mobile.py
          python scripts/check-mobile-v1140.py
          python scripts/check-user-guide.py
      - name: Record validated source and real history
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('docs/development-commits.tsv')
          existing = p.read_text(encoding='utf-8')
          seen = {line.split('\t')[0] for line in existing.splitlines()}
          recent = subprocess.check_output(['git', 'log', '--reverse', '--format=%H%x09%aI%x09%an%x09%s', '7c0f3a77d9dd9f82030b4def11df020cfea889aa..HEAD'], text=True)
          added = [line for line in recent.splitlines() if line.split('\t')[0] not in seen]
          p.write_text(existing.rstrip() + '\n' + '\n'.join(added) + '\n', encoding='utf-8')
          p = Path('docs/v1/HANDOFF.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n\n## Validated candidate\n\nExecutable source: 165591cdfe5e682f928c739d4a9ecc088aaa09f2.\nWindows CI: 34952365172, successful (100 passed, 0 failed, 3 ignored).\nDesktop GUI capture: 34953602785. Publication workflow: ${{ github.run_id }}.\nThe public release and main references must be verified after the publication job completes.\n', encoding='utf-8')
      - name: Commit guides and screenshots without changing the executable
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code 165591cdfe5e682f928c739d4a9ecc088aaa09f2 -- Cargo.toml Cargo.lock src ui resources build.rs
          git add README.md README.zh-CN.md CHANGELOG.md docs scripts
          git add -u .github
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish v1.14.0 guides, current desktop and phone GUI, and development record'
            git push origin HEAD:refs/heads/release/v1.14.0
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=release-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1140-publication-documentation
          path: |
            release-source.zip
            artifacts/mobile-checks/**
          retention-days: 14
  package-and-publish:
    needs: documentation
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_SOURCE_SHA: 165591cdfe5e682f928c739d4a9ecc088aaa09f2
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.documentation.outputs.source }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v1140-application
          run-id: 34952365172
          github-token: ${{ github.token }}
          path: accepted-application
      - name: Package validated application in two ZIP editions
        run: |
          if ((Get-Content accepted-application/SOURCE.txt -Raw).Trim() -ne $env:PRODUCT_SOURCE_SHA) { throw 'Wrong executable source' }
          & scripts/build-release.ps1 -ApplicationDirectory accepted-application
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Installation, migration and startup check
        run: |
          $installer = (Resolve-Path artifacts/release/v1.14.0/installer-output/FlyPPTTimer-v1.14.0-setup-win-x64.exe).Path
          $install = Join-Path $env:LOCALAPPDATA 'FlyPPTTimer'
          $p = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          $installedExe = Join-Path $install 'FlyPPTTimer.exe'
          if ((Get-FileHash $installedExe).Hash -ne (Get-FileHash accepted-application/FlyPPTTimer.exe).Hash) { throw 'Installed application differs' }
          foreach ($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll')) {
            if (-not (Test-Path (Join-Path $install $dll))) { throw "Missing runtime $dll" }
          }
          $configPath = Join-Path $install 'FlyPPTTimer.config.json'
          $cfg = Get-Content $configPath -Raw | ConvertFrom-Json
          $cfg.Appearance.ManualWidth = 210
          $cfg.Version = '1.13.1'
          $cfg.Placement.Visible = $false
          $cfg.Update.CheckOnStartup = $false
          $cfg | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          $before = Get-Content $configPath -Raw
          $p = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Get-Content $configPath -Raw) -ne $before) { throw 'Upgrade overwrote user configuration' }
          $app = Start-Process $installedExe -WorkingDirectory $install -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            $state = $null
            do {
              Start-Sleep -Milliseconds 250
              if ($app.HasExited) { throw 'Installed app exited unexpectedly' }
              $cfg = Get-Content $configPath -Raw | ConvertFrom-Json
              if ($cfg.RemoteControl.Token) {
                try { $state = Invoke-RestMethod "http://127.0.0.1:$($cfg.RemoteControl.Port)/state?token=$($cfg.RemoteControl.Token)" -TimeoutSec 2 } catch { $state = $null }
              }
              if ((Get-Date) -gt $deadline) { throw 'Installed app did not publish initial state' }
            } until ($state.timerState.displayText -and $state.timerState.windowVisible)
            if ($state.version -ne '1.14.0' -or -not $cfg.Update.CheckOnStartup -or $cfg.Appearance.ManualWidth -ne 210) { throw 'Startup migration mismatch' }
            New-Item -ItemType Directory -Force artifacts/release/v1.14.0/evidence | Out-Null
            $state | ConvertTo-Json -Depth 20 | Set-Content artifacts/release/v1.14.0/evidence/installed-state.json -Encoding utf8
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          'Installation, unchanged executable, runtime dependencies, preserved configuration, startup migration and live Remote state passed.' | Set-Content artifacts/release/v1.14.0/evidence/installer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FlyPPTTimer-v1.14.0-public-packages
          path: artifacts/release/v1.14.0/*.zip
          retention-days: 14
      - name: Publish portable ZIP and setup ZIP
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Main changed; review before publishing' }
          $files = @(Get-ChildItem artifacts/release/v1.14.0/*.zip)
          if ($files.Count -ne 2) { throw 'Expected exactly two ZIPs' }
          gh release create v1.14.0 $files[0].FullName $files[1].FullName --target '${{ needs.documentation.outputs.source }}' --title 'FlyPPTTimer v1.14.0' --notes-file docs/RELEASE_NOTES_v1.14.0.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          gh release view v1.14.0 --json url,tagName,isDraft,isPrerelease,assets | Set-Content artifacts/release/v1.14.0/evidence/published-release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1140-publication-evidence
          path: |
            artifacts/release/v1.14.0/evidence/**
            install.log
          retention-days: 14
