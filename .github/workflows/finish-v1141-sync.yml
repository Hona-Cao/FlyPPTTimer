name: Finish v1.14.1 Gitee synchronization
on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-v1141-sync.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: sync-gitee-v1.14.1
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: hona-cao
      GITEE_REPO: fly-ppttimer
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Fix transfer timeout without changing the published packages
        shell: python
        run: |
          from pathlib import Path
          import ast,subprocess
          p=Path('scripts/sync-gitee-release.py')
          s=p.read_text()
          s=s.replace('response = session.request(method, api + suffix, timeout=(20, 180), **kwargs)', 'print(f"Gitee API: {method} {suffix}", flush=True)\n        response = session.request(method, api + suffix, timeout=(20, 180), **kwargs)')
          old='''            with path.open('rb') as data:
                          request('POST', endpoint, data={'access_token': token, 'owner': owner, 'repo': repo,
                                                        'release_id': str(release_id)},
                                  files={'file': (name, data, 'application/zip')})'''
          replacement='''            # curl separates connection timeout from the full multipart transfer.
                      # Credentials go through stdin, never command arguments or logs.
                      auth = f'header = "Authorization: Bearer {token}"\\nform-string = "access_token={token}"\\n'
                      upload = subprocess.run([
                          'curl', '--config', '-', '--fail-with-body', '--silent', '--show-error',
                          '--connect-timeout', '30', '--max-time', '900', '--header', 'Expect:',
                          '--form-string', f'owner={owner}', '--form-string', f'repo={repo}',
                          '--form-string', f'release_id={release_id}',
                          '--form', f'file=@{path};type=application/zip', api + endpoint,
                      ], input=auth, capture_output=True, text=True)
                      if upload.returncode:
                          raise RuntimeError(f'Gitee upload failed for {name}: ' + upload.stderr[-600:] + upload.stdout[-400:])'''
          assert old in s, 'Upload block changed; inspect before patching'
          s=s.replace(old,replacement,1)
          ast.parse(s)
          p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('docs/USER_GUIDE.zh-CN.md');s=p.read_text()
          s=s.replace('下载前先看[本页版本说明](../README.zh-CN.md#download)：公开安装包目前仍为 v1.14.0，不能据此期待 v1.14.1 的新行为。','从[下载与安装](../README.zh-CN.md#download)选择 v1.14.1 的便携版或安装版，二者都包含本教程说明的新功能。')
          p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('.gitignore');s=p.read_text()
          if '__pycache__/' not in s:s+='\n__pycache__/\n*.py[cod]\n'
          p.write_text(s,encoding='utf-8',newline='\n')
          subprocess.run(['git','rm','-r','--ignore-unmatch','scripts/__pycache__'],check=True)
      - name: Save synchronization repair and corrected documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync-gitee-release.py docs/USER_GUIDE.zh-CN.md .gitignore
          git diff --cached --check
          git commit -m 'fix: give Gitee multipart uploads a full transfer timeout and correct remaining version note'
          git push origin HEAD:refs/heads/main
      - name: Synchronize existing release without rebuilding or repackaging
        run: python scripts/sync-gitee-release.py v1.14.1
      - name: Record successful GitHub and Gitee publication
        shell: python
        run: |
          from pathlib import Path
          import json,subprocess
          gitee=json.loads(Path('artifacts/publication/gitee-release.json').read_text())
          github=json.loads(subprocess.check_output(['gh','release','view','v1.14.1','--json','url,isDraft,isPrerelease,assets'],text=True))
          assert not github['isDraft'] and not github['isPrerelease']
          assert gitee['public_downloads_match']
          result={'github':github,'gitee':gitee,'existing_packages_reused':True,'workflow':'${{ github.run_id }}'}
          Path('artifacts/publication/completed.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          p=Path('docs/v1/HANDOFF.md');s=p.read_text()
          s+='\n## Publication completed\n\nGitHub v1.14.1 is published as Latest with exactly two original ZIPs. Gitee release metadata and both public downloads are verified byte-for-byte. Publication workflow 35041893653; Gitee transfer repair and verification ${{ github.run_id }}. No compilation, repackaging or prior tag changes. Current README and bilingual guide links refer to v1.14.1.\n'
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Save completion record
        run: |
          git add docs/v1/HANDOFF.md
          git diff --cached --check
          git commit -m 'docs: record verified v1.14.1 publication on GitHub and Gitee'
          git push origin HEAD:refs/heads/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1141-completed-publication
          path: artifacts/publication/**
          if-no-files-found: ignore
          retention-days: 14
