name: RC portable runtime assembly

on:
  push:
    branches: [codex/v1-06-manual-test]
    paths: [.github/workflows/rc-portable-runtime.yml]

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlyPPTTimer-portable-win-x64-96273ddf0e34fe73902f9fcd3ea4a6f356138c18
          run-id: 34550315848
          github-token: ${{ github.token }}
          path: portable
      - name: Add signed redistributable runtime and check process loading
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = (Resolve-Path portable).Path
          $build = Get-Content "$stage\BUILD.txt" -Raw
          if (-not $build.Contains('96273ddf0e34fe73902f9fcd3ea4a6f356138c18')) { throw 'Unexpected source artifact' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Filter vcruntime140.dll | Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC14[0-9]\.CRT\\vcruntime140\.dll$' } | Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Redistributable x64 VCRUNTIME140.dll not found' }
          $dlls = @($crt.FullName)
          $extra = Join-Path $crt.DirectoryName 'vcruntime140_1.dll'
          if (Test-Path $extra) { $dlls += $extra }
          foreach ($dll in $dlls) {
            $signature = Get-AuthenticodeSignature $dll
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw "Invalid Microsoft signature: $dll" }
            Copy-Item $dll $stage
            Write-Output "Runtime: $([IO.Path]::GetFileName($dll)) version $((Get-Item $dll).VersionInfo.FileVersion); Microsoft signature valid"
          }
          @'
          Microsoft Visual C++ runtime files are included unmodified from the Visual Studio x64 Redist directory for app-local deployment with this program. They are Microsoft components, not covered by the project MIT license.
          https://learn.microsoft.com/en-us/visualstudio/releases/2022/redistribution
          https://learn.microsoft.com/en-us/cpp/windows/redistributing-visual-cpp-files
          App-local runtime files must be kept beside FlyPPTTimer.exe. No runtime installer is executed. This is a test package, not a formal release.
          '@ | Set-Content "$stage\THIRD_PARTY_RUNTIME.txt" -Encoding utf8
          $configPath = "$stage\FlyPPTTimer.config.json"
          $originalConfig = [IO.File]::ReadAllBytes($configPath)
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.RemoteControl.Enabled = $false
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          $process = $null
          try {
            $process = Start-Process "$stage\FlyPPTTimer.exe" -WorkingDirectory $stage -PassThru
            Start-Sleep -Seconds 4
            $process.Refresh()
            if ($process.HasExited) { throw "Process exited during loader smoke: $($process.ExitCode)" }
            $loaded = $process.Modules | Where-Object { $_.ModuleName -ieq 'VCRUNTIME140.dll' } | Select-Object -First 1
            if (-not $loaded -or $loaded.FileName -ine "$stage\vcruntime140.dll") { throw 'App-local runtime was not loaded' }
            Write-Output 'Release process survived loader smoke and loaded the bundled VCRUNTIME140.dll. This is not GUI/Office acceptance.'
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            [IO.File]::WriteAllBytes($configPath, $originalConfig)
          }
          Add-Content "$stage\BUILD.txt" 'App-local Microsoft-signed x64 VCRUNTIME included. Loader smoke passed on Windows Server 2022; Windows 11 GUI/Office acceptance remains pending.'
          New-Item -ItemType Directory -Force portable-final | Out-Null
          foreach ($name in @('FlyPPTTimer.exe','FlyPPTTimer.config.json','LICENSE','BUILD.txt','vcruntime140.dll','vcruntime140_1.dll','THIRD_PARTY_RUNTIME.txt')) {
            if (Test-Path "$stage\$name") { Copy-Item "$stage\$name" portable-final }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FlyPPTTimer-portable-with-runtime-96273dd
          path: portable-final/
          if-no-files-found: error
          retention-days: 7
