name: Verify signed GitHub artifact handoff

on:
  push:
    branches: [release/v1.16.0-docs]
    paths: [.github/workflows/v1160-signed-artifact-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download short-lived signed artifact and verify digest
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-3e6c-8211-b698-c3395b944278/raw?se=2026-09-17T15%3A31%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=9de7f5ef-3a02-587f-b92b-3e93556ed2ee&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T06%3A07%3A45Z&ske=2026-09-18T06%3A07%3A45Z&sks=b&skv=2026-02-06&sig=/Bnp9XPHzR0k3c%2Bb/Z6ghR3DNxpyKQS8ir9L9bnk0uc%3D'
          curl --fail --silent --show-error --location "$url" -o artifact.zip
          echo '24c76f122a3d589c9be27350ca209576042b628614dc561b71c0bba3117bc410  artifact.zip' | sha256sum --check
          unzip -q artifact.zip -d artifact
          grep -Fx 'harmless v1.16 artifact probe' artifact/probe.txt
          echo 'SIGNED_ARTIFACT_HANDOFF=yes'
      - name: Remove one-shot probe
        if: always()
        run: |
          git rm .github/workflows/v1160-signed-artifact-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove signed Artifact handoff probe'
          git push origin HEAD:release/v1.16.0-docs
