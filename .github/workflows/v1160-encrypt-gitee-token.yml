name: Encrypt Gitee credential for v1.16 private release handoff

on:
  push:
    branches: [release/v1.16.0-docs]
    paths: [.github/workflows/v1160-encrypt-gitee-token.yml]

permissions:
  contents: write

jobs:
  encrypt:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Encrypt token with one-time public key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GITEE_TOKEN" ]; then echo 'GITEE_TOKEN missing' >&2; exit 1; fi
          cat > public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAq9BTYdda1+romUOVkaYD
          iIEDr7B4psOOUrlnE0QtmfwJzyrRrfSFVJIAYQ6TIDXKnNLFIzUOQbqo8vuKSUui
          bfnwtjQ4OaJS2Nz2I/2gVc/y6mX9LNrD9ej1/b5BC2kRqvaaqUxz/6AhZTvA1fNZ
          bqSasMkPSVNGY6+svwg+TOvoKXNBeoTZZmkb7ZSOOMKSgIDQGZLsvUDxvc88P2cZ
          JY3JaHAQQcICQW5K1iB0QVVUFPoS5+7x10yk2PoM0+ZotkRnFi6mojVvkDmJHrSc
          AjFtK/YkOdLxhCczvBNbIriYH2mUDG9L5UbfNi/izDJcbvfGU4H/SlKbTRU67qmn
          wr8XzmactAnK3YiMrIo+q08LJCIwuGr0VYmMpbaEbhjQQCOZrrUed9FAjjPlX/gd
          WvOrB23NCDYkphCJF9jsGGne/z8xkQR0S1j9wsyOA4p0i1bIJASnMgxFr8HWdPIl
          A2oA1dZ+MVEHsVQ3g1yCKGY98DhAXizjdSk58pPHHQZoxTOvTNiJuOBA/Ivd0iD7
          79nQVswL72Yo3pDb+C+fWAur5P9QRuJTkf4inuU32MKa8je6hDoVF4P9rg7O+l/U
          KO8ks5UZF+7Fynx8baJlN9T5DHk/t16RwsfWuS6eXm3QqCFbQKJZOxtzt605VRXj
          4oZwNt9jOCb5cFjjxXCq+gUCAwEAAQ==
          -----END PUBLIC KEY-----
          EOF
          printf '%s' "$GITEE_TOKEN" > token.txt
          openssl pkeyutl -encrypt -pubin -inkey public.pem -in token.txt -out token.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          base64 -w0 token.enc > .v1160-gitee-token.enc.b64
          printf '\n' >> .v1160-gitee-token.enc.b64
          rm -f token.txt token.enc public.pem
      - name: Commit ciphertext and remove one-shot workflow
        run: |
          git rm .github/workflows/v1160-encrypt-gitee-token.yml
          git add .v1160-gitee-token.enc.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: stage encrypted one-time Gitee handoff'
          git push origin HEAD:release/v1.16.0-docs
