name: Correct and validate v1.15.0 release branch

on:
  push:
    branches: [main]
    paths: [.github/workflows/v1150-bootstrap.yml]

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.15.0
          fetch-depth: 0
      - name: Correct only the two NOTIFYICONDATAW declarations
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/desktop.rs')
          s=p.read_text(encoding='utf-8')
          notify='''    pub fn notify(&self, message: &str, milliseconds: u32) {\n        let data = NOTIFYICONDATAW {'''
          assert notify in s
          s=s.replace(notify,'''    pub fn notify(&self, message: &str, milliseconds: u32) {\n        let mut data = NOTIFYICONDATAW {''',1)
          tray='''unsafe fn update_tray_icon(hwnd: HWND) {\n    let icon = load_badged_app_icon(current_badge_color().as_deref());\n    let mut data = NOTIFYICONDATAW {'''
          assert tray in s
          s=s.replace(tray,'''unsafe fn update_tray_icon(hwnd: HWND) {\n    let icon = load_badged_app_icon(current_badge_color().as_deref());\n    let data = NOTIFYICONDATAW {''',1)
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Format and commit focused fix
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          cargo +$RUST_TOOLCHAIN fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/desktop.rs
          git commit -m 'fix: correct tray notification mutability'
          git push origin HEAD:release/v1.15.0

  validate:
    needs: fix
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: release/v1.15.0
          fetch-depth: 0
      - name: Install pinned Rust and Windows SDK resource compiler
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          $rc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter rc.exe -Recurse | Where-Object FullName -Match '\\x64\\rc.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'rc.exe not found' }
          $rc.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1150-windows-1.92-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            v1150-windows-1.92-${{ hashFiles('Cargo.lock') }}-
            rust-windows-1.92-${{ hashFiles('Cargo.lock') }}-
      - name: Format and Clippy
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Format failed' }
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | Tee-Object clippy.log
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Tests and web syntax
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          cargo test --locked 2>&1 | Tee-Object artifacts/ci/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          node --check src/FlyPPTTimer/Web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Web syntax failed' }
      - name: Release build
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $version=(Get-Item target/release/FlyPPTTimer.exe).VersionInfo.ProductVersion
          if ($version -ne '1.15.0') { throw "Unexpected ProductVersion $version" }
          Copy-Item target/release/FlyPPTTimer.exe artifacts/ci/FlyPPTTimer.exe
          Get-ChildItem target/release/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts/ci
          git rev-parse HEAD | Set-Content artifacts/ci/SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1150-validation
          path: |
            artifacts/ci/**
            clippy.log
          retention-days: 14
