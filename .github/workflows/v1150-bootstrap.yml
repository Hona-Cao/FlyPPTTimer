name: Finalize and validate v1.15.0 release branch

on:
  push:
    branches: [main]
    paths: [.github/workflows/v1150-bootstrap.yml]

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.15.0
          fetch-depth: 0
      - name: Normalize the legacy default comparison for the approved new stopwatch default
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/config.rs')
          s=p.read_text(encoding='utf-8')
          needle='''        let mut expected: Value = serde_json::from_str(V0302_DEFAULT_CONFIG).unwrap();\n        let config = AppConfig {'''
          replacement='''        let mut expected: Value = serde_json::from_str(V0302_DEFAULT_CONFIG).unwrap();\n        // v1.15 intentionally changes only the fresh per-slide-stopwatch default;\n        // it is not a v0.30.2 parity field anymore.\n        expected["Timer"]\n            .as_object_mut()\n            .unwrap()\n            .remove("EnablePerSlideTimer");\n        let config = AppConfig {'''
          assert s.count(needle) == 1
          p.write_text(s.replace(needle,replacement,1),encoding='utf-8',newline='\n')
      - name: Commit the focused regression-test correction
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          cargo +$RUST_TOOLCHAIN fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.rs
          git commit -m 'test: exclude v1.15 stopwatch default from legacy parity'
          git push origin HEAD:release/v1.15.0

  validate:
    needs: fix
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: release/v1.15.0
          fetch-depth: 0
      - name: Install pinned Rust and Windows SDK resource compiler
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          $rc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter rc.exe -Recurse | Where-Object FullName -Match '\\x64\\rc.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'rc.exe not found' }
          $rc.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1150-final-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            v1150-windows-1.92-${{ hashFiles('Cargo.lock') }}-
            rust-windows-1.92-${{ hashFiles('Cargo.lock') }}-
      - name: Format, Clippy, tests, web syntax and release build
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Format failed' }
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | Tee-Object artifacts/ci/clippy.log
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --locked 2>&1 | Tee-Object artifacts/ci/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          node --check src/FlyPPTTimer/Web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Web syntax failed' }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $exe='target/release/FlyPPTTimer.exe'
          $version=(Get-Item $exe).VersionInfo.ProductVersion
          if ($version -ne '1.15.0') { throw "Unexpected ProductVersion $version" }
          Copy-Item $exe artifacts/ci/FlyPPTTimer.exe
          Get-ChildItem target/release/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts/ci
          git rev-parse HEAD | Set-Content artifacts/ci/SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1150-final-validation
          path: artifacts/ci/**
          retention-days: 14
