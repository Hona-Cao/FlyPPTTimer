name: FlyPPTTimer v1.14.0
on:
  push:
    branches: [release/v1.14.0]
    paths: [.github/workflows/release-v1140.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: v1140-source
          path: source.zip
          retention-days: 7
