name: FlyPPTTimer v1.14.0
on:
  push:
    branches: [release/v1.14.0]
    paths: [.github/workflows/release-v1140.yml, .github/v1140-fix.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: release-v1140
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.14.0 source
        run: |
          python .github/v1140-apply.py
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          if (Test-Path .github/v1140-fix.py) {
            python .github/v1140-fix.py
            if ($LASTEXITCODE -ne 0) { throw 'Source refinement failed' }
          }
          New-Item -ItemType Directory -Force artifacts/evidence,artifacts/application | Out-Null
      - name: Windows SDK and Rust
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $rc = Get-ChildItem -LiteralPath $kits -Filter rc.exe -File -Recurse | Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          $rc.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1140-windows-1.92-${{ github.run_id }}
          restore-keys: |
            v1140-windows-1.92-
            v1131-windows-1.92-
            rc34-windows-1.92-
      - name: Format and lint
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'Format failed' }
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | Tee-Object artifacts/evidence/clippy.log
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Regression tests
        run: |
          cargo test --locked 2>&1 | Tee-Object artifacts/evidence/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          node --check src/FlyPPTTimer/Web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Web syntax failed' }
      - name: Release executable
        run: |
          cargo build --locked --release 2>&1 | Tee-Object artifacts/evidence/release.log
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $version = (Get-Item target/release/FlyPPTTimer.exe).VersionInfo
          $version | Select-Object FileVersion,ProductVersion | Format-List | Out-File artifacts/evidence/version.txt
          if ($version.FileVersion -ne '1.14.0' -or $version.ProductVersion -ne '1.14.0') { throw 'Version mismatch' }
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1140-windows-1.92-${{ github.run_id }}
      - name: Light and dark GUI renders
        run: |
          foreach ($theme in @('light','dark')) {
            $env:FLYPPT_CAPTURE_THEME = $theme
            foreach ($mode in @('settings','windows')) {
              $out = Join-Path $PWD "artifacts/evidence/$theme/$mode"
              New-Item -ItemType Directory -Force $out | Out-Null
              $p = Start-Process target/release/FlyPPTTimer.exe -ArgumentList @("--capture-$mode", $out) -Wait -PassThru -RedirectStandardOutput "$out/stdout.log" -RedirectStandardError "$out/stderr.log"
              if ($p.ExitCode -ne 0) { throw "Capture failed: $theme/$mode" }
            }
          }
          Remove-Item Env:FLYPPT_CAPTURE_THEME
      - name: Startup and Remote smoke
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'v1140-startup'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/FlyPPTTimer.exe $stage
          $configPath = Join-Path $stage 'FlyPPTTimer.config.json'
          $seed = Get-Content docs/v1140-default-config.json -Raw | ConvertFrom-Json
          $seed.Placement.Visible = $false
          $seed.Update.CheckOnStartup = $false
          $seed | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          $process = Start-Process (Join-Path $stage 'FlyPPTTimer.exe') -WorkingDirectory $stage -ArgumentList '--show-settings' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 150
              $config = Get-Content $configPath -Raw | ConvertFrom-Json
              if ((Get-Date) -gt $deadline) { throw 'Startup did not initialize' }
            } until ($config.Placement.Visible -and $config.RemoteControl.Token)
            $base = "http://127.0.0.1:$($config.RemoteControl.Port)"
            $state = Invoke-RestMethod "$base/state?token=$($config.RemoteControl.Token)" -TimeoutSec 8
            $state | ConvertTo-Json -Depth 12 | Set-Content artifacts/evidence/startup-state.json
            if ($state.version -ne '1.14.0') { throw 'Remote version mismatch' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Commit product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src ui resources scripts docs
          git add -u .github
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'feat: release v1.14.0 slide timing, PPT browsing and unified controls'
            if ($LASTEXITCODE -ne 0) { throw 'Product commit failed' }
            git push origin HEAD:refs/heads/release/v1.14.0
            if ($LASTEXITCODE -ne 0) { throw 'Product push failed' }
          }
          git rev-parse HEAD | Set-Content artifacts/application/SOURCE.txt
          Copy-Item target/release/FlyPPTTimer.exe artifacts/application/
          git archive --format=zip --output=artifacts/evidence/product-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: v1140-application
          path: artifacts/application/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1140-evidence
          path: artifacts/evidence/**
          retention-days: 14
