name: FlyPPTTimer v1.13.1
on:
  push:
    branches: [chatgpt/v1.13.1]
    paths: [.github/workflows/package-v1131.yml, .github/v1131-apply.py]
permissions:
  contents: write
concurrency:
  group: package-v1131
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.13.1 source
        run: |
          python .github/v1131-apply.py
          if ($LASTEXITCODE -ne 0) { throw 'Source application failed' }
          python -c "from pathlib import Path; p=Path('src/FlyPPTTimer/Web/app.js'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('swipeStart=null;renderPage(pageIndex,true);return}swipeStart.baseX=freezeTrack()', 'swipeStart=null;return}swipeStart.baseX=freezeTrack()'),encoding='utf-8',newline='\n')"
          New-Item -ItemType Directory -Force artifacts/evidence | Out-Null
      - name: Windows SDK resource compiler
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $rc = Get-ChildItem -LiteralPath $kits -Filter rc.exe -File -Recurse | Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'Windows SDK rc.exe missing' }
          $rc.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1131-windows-1.92-${{ github.run_id }}
          restore-keys: |
            v1131-windows-1.92-
            rc34-windows-1.92-
      - name: Format and lint
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'Format failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace error' }
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | Tee-Object artifacts/evidence/clippy.log
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Regression tests
        run: |
          cargo test --locked 2>&1 | Tee-Object artifacts/evidence/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          node --check src/FlyPPTTimer/Web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax failed' }
      - name: Release executable and version metadata
        run: |
          cargo build --locked --release 2>&1 | Tee-Object artifacts/evidence/release.log
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $version = (Get-Item target/release/FlyPPTTimer.exe).VersionInfo
          $version | Select-Object FileVersion,ProductVersion | Format-List | Out-File artifacts/evidence/version.txt
          if ($version.FileVersion -ne '1.13.1' -or $version.ProductVersion -ne '1.13.1') { throw 'Executable version mismatch' }
      - name: Save compiled cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1131-windows-1.92-${{ github.run_id }}
      - name: Light and dark UI captures
        run: |
          foreach ($theme in @('light','dark')) {
            $env:FLYPPT_CAPTURE_THEME = $theme
            foreach ($mode in @('settings','windows')) {
              $out = Join-Path $PWD "artifacts/evidence/$theme/$mode"
              New-Item -ItemType Directory -Force $out | Out-Null
              $p = Start-Process target/release/FlyPPTTimer.exe -ArgumentList @("--capture-$mode", $out) -Wait -PassThru -RedirectStandardOutput "$out/stdout.log" -RedirectStandardError "$out/stderr.log"
              if ($p.ExitCode -ne 0) { throw "Capture failed: $theme/$mode exit $($p.ExitCode)" }
            }
          }
          Remove-Item Env:FLYPPT_CAPTURE_THEME
      - name: Startup visibility and delayed HTTP request
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'v1131-startup'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/FlyPPTTimer.exe $stage
          $exe = Join-Path $stage 'FlyPPTTimer.exe'
          $configPath = Join-Path $stage 'FlyPPTTimer.config.json'
          $seed = Get-Content docs/v1131-default-config.json -Raw | ConvertFrom-Json
          $seed.Placement.Visible = $false
          $seed.Update.CheckOnStartup = $false
          $seed | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          $process = Start-Process $exe -WorkingDirectory $stage -ArgumentList '--show-settings' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 150
              $config = Get-Content $configPath -Raw | ConvertFrom-Json
              if ((Get-Date) -gt $deadline) { throw 'Startup did not restore visible timer' }
            } until ($config.Placement.Visible -and $config.RemoteControl.Token)
            $port = [int]$config.RemoteControl.Port
            $token = [string]$config.RemoteControl.Token
            'Previous Visible=false; startup Visible=true; --show-settings process running.' | Set-Content artifacts/evidence/startup.txt
            $client = [System.Net.Sockets.TcpClient]::new()
            $client.Connect('127.0.0.1', $port)
            try {
              Start-Sleep -Milliseconds 250
              $stream = $client.GetStream()
              $stream.ReadTimeout = 8000
              $request = "GET /?token=$token HTTP/1.1`r`nHost: localhost`r`nConnection: close`r`n`r`n"
              $bytes = [Text.Encoding]::ASCII.GetBytes($request)
              $stream.Write($bytes, 0, $bytes.Length)
              $buffer = New-Object byte[] 8192
              $builder = [Text.StringBuilder]::new()
              while (($count = $stream.Read($buffer, 0, $buffer.Length)) -gt 0) { [void]$builder.Append([Text.Encoding]::UTF8.GetString($buffer, 0, $count)) }
              $response = $builder.ToString()
              if ($response -notmatch '^HTTP/1\.1 200' -or $response -notmatch 'FlyPPTTimer') { throw 'Unexpected HTTP response' }
              $response | Set-Content artifacts/evidence/startup-http.txt -Encoding utf8
            } finally { $client.Dispose() }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Commit product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock build.rs resources src ui docs scripts/build-release.ps1
          git commit -m 'fix: v1.13.1 mobile gestures precise percentages and window lifecycle'
          if ($LASTEXITCODE -ne 0) { throw 'Product commit failed' }
          $sha = (git rev-parse HEAD).Trim()
          "PRODUCT_SHA=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          git push origin HEAD:refs/heads/chatgpt/v1.13.1
          if ($LASTEXITCODE -ne 0) { throw 'Product push failed' }
          git archive --format=zip --output=artifacts/evidence/product-source.zip HEAD
      - name: Package portable
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'FlyPPTTimer-v1.13.1-portable-win-x64'
          $stage = Join-Path $env:RUNNER_TEMP $name
          $out = Join-Path $PWD 'artifacts/package'
          New-Item -ItemType Directory -Force $stage,$out | Out-Null
          Copy-Item target/release/FlyPPTTimer.exe $stage
          Copy-Item docs/v1131-default-config.json (Join-Path $stage 'FlyPPTTimer.config.json')
          Copy-Item LICENSE $stage
          Copy-Item docs/v1/V1131_USAGE.zh-CN.md (Join-Path $stage 'README.zh-CN.md')
          Copy-Item docs/v1/V1131_DELIVERY.md (Join-Path $stage 'CHANGES.md')
          foreach ($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll')) { Copy-Item (Join-Path $env:WINDIR "System32\$dll") $stage }
          $hash = (Get-FileHash (Join-Path $stage 'FlyPPTTimer.exe') -Algorithm SHA256).Hash
          @('FlyPPTTimer v1.13.1','Version: 1.13.1',"Product source SHA: $env:PRODUCT_SHA","Workflow run: $env:GITHUB_RUN_ID","EXE SHA256: $hash",'Validation: fmt; clippy; cargo test; JS syntax; release; Windows version metadata; light/dark captures; startup visibility; delayed HTTP.','Main unchanged. No public Release or tag created.') | Set-Content (Join-Path $stage 'BUILD.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $out "$name.zip") -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: FlyPPTTimer-v1.13.1-portable-win-x64
          path: artifacts/package/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1.13.1-evidence
          path: artifacts/evidence/**
          if-no-files-found: warn
          retention-days: 14
