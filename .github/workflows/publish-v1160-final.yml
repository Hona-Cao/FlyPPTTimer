name: Finish FlyPPTTimer v1.16.0 Gitee publication

on:
  push:
    branches: [release/v1.16.0-docs]
    paths: [.github/workflows/publish-v1160-final.yml]

permissions:
  contents: write

concurrency:
  group: publish-v1160-final
  cancel-in-progress: false

env:
  VERSION: '1.16.0'
  PUBLIC_MAIN_SHA: 'dbbeef7c8224040aae62b85fd2bfd856027ed430'
  PRODUCT_SOURCE_SHA: '6adb4a14c3eb4ea8292a76355282050877254297'
  PUBLIC_DOCS_SHA: '3578d63c4e866cabd99e403e7ffcb29eae7ceb85'
  PORTABLE_SHA256: 'ae4f7d4e0b227a807b4da549c91831730eea99d5b286848cd514baf28d9c4d39'
  PORTABLE_SIZE: '19425051'
  SETUP_SHA256: 'ac1ed057510df867f0b36ac2ba4a55f48a254b035bb20759ec735799bfad3106'
  SETUP_SIZE: '16286516'
  GITEE_OWNER: 'hona-cao'
  GITEE_REPO: 'fly-ppttimer'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard GitHub v1.16.0 as the verified source of public package bytes
        shell: bash
        run: |
          set -euo pipefail
          actual=$(gh api repos/Hona-Cao/FlyPPTTimer/commits/main --jq .sha)
          [ "$actual" = "$PUBLIC_MAIN_SHA" ] || { echo "Unexpected public main: $actual" >&2; exit 1; }
          test -n "$GITEE_TOKEN" || { echo 'GITEE_TOKEN is unavailable' >&2; exit 1; }
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets > github-release.json
          python - <<'PY'
          import json,os
          r=json.load(open('github-release.json',encoding='utf-8'))
          expected={f"FlyPPTTimer-v{os.environ['VERSION']}-portable-win-x64.zip",f"FlyPPTTimer-v{os.environ['VERSION']}-setup-win-x64.zip"}
          names={a['name'] for a in r['assets']}
          if r['tagName']!='v'+os.environ['VERSION'] or r['isDraft'] or r['isPrerelease'] or names!=expected:
              raise SystemExit(f'Unexpected GitHub release state: {r}')
          PY

      - name: Download GitHub Release assets and verify the accepted hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern '*.zip'
          python - <<'PY'
          from pathlib import Path
          import hashlib,os,zipfile
          expected={
              f"FlyPPTTimer-v{os.environ['VERSION']}-portable-win-x64.zip":(os.environ['PORTABLE_SHA256'],int(os.environ['PORTABLE_SIZE'])),
              f"FlyPPTTimer-v{os.environ['VERSION']}-setup-win-x64.zip":(os.environ['SETUP_SHA256'],int(os.environ['SETUP_SIZE'])),
          }
          found={p.name:p for p in Path('release-assets').glob('*.zip')}
          if set(found)!=set(expected): raise SystemExit(f'Unexpected GitHub asset set: {sorted(found)}')
          for name,p in found.items():
              digest=hashlib.sha256(p.read_bytes()).hexdigest(); size=p.stat().st_size
              if not zipfile.is_zipfile(p) or (digest,size)!=expected[name]:
                  raise SystemExit(f'GitHub asset identity mismatch: {name}')
          print('GitHub Release bytes re-verified before Gitee retry.')
          PY

      - name: Install Gitee verification dependency
        run: python -m pip install 'requests>=2.32,<3'

      - name: Publish and publicly verify identical assets on Gitee
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess,tempfile,time
          import requests

          version=os.environ['VERSION']; tag='v'+version
          owner=os.environ['GITEE_OWNER']; repo=os.environ['GITEE_REPO']; token=os.environ['GITEE_TOKEN']
          main_sha=os.environ['PUBLIC_MAIN_SHA']
          api=f'https://gitee.com/api/v5/repos/{owner}/{repo}'
          files={
              f'FlyPPTTimer-v{version}-portable-win-x64.zip': Path('release-assets')/f'FlyPPTTimer-v{version}-portable-win-x64.zip',
              f'FlyPPTTimer-v{version}-setup-win-x64.zip': Path('release-assets')/f'FlyPPTTimer-v{version}-setup-win-x64.zip',
          }
          records={
              f'FlyPPTTimer-v{version}-portable-win-x64.zip': {'sha256':os.environ['PORTABLE_SHA256'],'size':int(os.environ['PORTABLE_SIZE'])},
              f'FlyPPTTimer-v{version}-setup-win-x64.zip': {'sha256':os.environ['SETUP_SHA256'],'size':int(os.environ['SETUP_SIZE'])},
          }

          session=requests.Session()
          session.headers.update({'Authorization':f'Bearer {token}','User-Agent':'FlyPPTTimer-v116-gitee-retry'})
          def req(method,suffix,missing_ok=False,**kwargs):
              last=None
              for attempt in range(1,4):
                  try:
                      r=session.request(method,api+suffix,timeout=(20,180),**kwargs)
                      if missing_ok and r.status_code==404: return None
                      r.raise_for_status()
                      return r.json() if r.content else None
                  except requests.RequestException as exc:
                      last=exc
                      if attempt<3: time.sleep(3*attempt)
              raise last

          # Ensure the Gitee tag exists and is never force-moved.
          with tempfile.TemporaryDirectory() as td:
              askpass=Path(td)/'askpass.py'
              askpass.write_text('#!/usr/bin/env python3\nimport os,sys\nprint(os.environ["GITEE_OWNER"] if "username" in sys.argv[1].lower() else os.environ["GITEE_TOKEN"])\n',encoding='utf-8')
              askpass.chmod(0o700)
              env=dict(os.environ,GIT_ASKPASS=str(askpass),GIT_TERMINAL_PROMPT='0')
              pushed=subprocess.run(['git','-c','credential.helper=','push',f'https://gitee.com/{owner}/{repo}.git',f'{main_sha}:refs/tags/{tag}'],env=env,capture_output=True,text=True,timeout=180)
              if pushed.returncode:
                  print(pushed.stderr[-500:],flush=True)
          commit=req('GET',f'/commits/{tag}',missing_ok=True)
          if commit is not None:
              got=commit.get('sha') or commit.get('id')
              if got and got!=main_sha: raise SystemExit(f'Gitee tag mismatch: {got}')

          notes=Path('docs/RELEASE_NOTES_v1.16.0.md').read_text(encoding='utf-8')
          payload={'tag_name':tag,'name':f'FlyPPTTimer {tag}','body':notes,'target_commitish':main_sha,'prerelease':False}
          release=req('GET',f'/releases/tags/{tag}',missing_ok=True)
          release=req('PATCH',f"/releases/{release['id']}",json=payload) if release else req('POST','/releases',json=payload)
          rid=release['id']; endpoint=f'/releases/{rid}/attach_files'

          def attachments():
              value=req('GET',endpoint)
              if not isinstance(value,list): raise RuntimeError('Unexpected Gitee attachment response')
              return value
          def find(name): return next((x for x in attachments() if x.get('name')==name),None)
          def item_url(item):
              url=item.get('browser_download_url') or item.get('download_url')
              if url and url.startswith('/'): url='https://gitee.com'+url
              return url
          def public_digest(item,name):
              url=item_url(item)
              if not url: return None
              with tempfile.NamedTemporaryFile(delete=False) as f: out=Path(f.name)
              try:
                  command=['curl','--http1.1','--location','--fail','--silent','--show-error','--connect-timeout','30','--max-time','600','--speed-time','120','--speed-limit','1024','--output',str(out),url]
                  done=subprocess.run(command,capture_output=True,text=True)
                  if done.returncode: return None
                  if out.stat().st_size!=records[name]['size']: return None
                  return hashlib.sha256(out.read_bytes()).hexdigest()
              finally:
                  out.unlink(missing_ok=True)
          def delete(item):
              if item and item.get('id'): req('DELETE',f"{endpoint}/{item['id']}")

          # Remove any unexpected/partial attachment left by the timed-out first attempt.
          for item in attachments():
              name=item.get('name')
              if name not in files:
                  delete(item)

          evidence={'tag':tag,'github_main':main_sha,'product_source':os.environ['PRODUCT_SOURCE_SHA'],'public_docs':os.environ['PUBLIC_DOCS_SHA'],'assets':{}}
          for name,path in files.items():
              existing=find(name)
              if existing and public_digest(existing,name)==records[name]['sha256']:
                  print(f'Already synchronized and verified: {name}',flush=True)
              else:
                  delete(existing)
                  success=False
                  for attempt in range(1,4):
                      print(f'Streaming {name} to Gitee (attempt {attempt}/3)...',flush=True)
                      command=[
                          'curl','--http1.1','--fail','--silent','--show-error',
                          '--connect-timeout','30','--max-time','1200','--speed-time','180','--speed-limit','512',
                          '-H',f'Authorization: Bearer {token}',
                          '-F',f'file=@{path};type=application/zip',
                          api+endpoint,
                      ]
                      upload=subprocess.run(command,capture_output=True,text=True)
                      if upload.returncode:
                          print(f'Upload command result {upload.returncode}: {upload.stderr[-300:]}',flush=True)
                      # A server can finish storing the multipart body even if the client loses the final response.
                      item=None
                      for poll in range(18):
                          item=find(name)
                          if item: break
                          time.sleep(5)
                      if item and public_digest(item,name)==records[name]['sha256']:
                          success=True
                          break
                      delete(item)
                      if attempt<3: time.sleep(10*attempt)
                  if not success: raise SystemExit(f'Unable to publish verified Gitee asset: {name}')
              item=find(name)
              digest=public_digest(item,name)
              if digest!=records[name]['sha256']: raise SystemExit(f'Final Gitee hash mismatch: {name}')
              evidence['assets'][name]={'sha256':digest,'size':records[name]['size'],'url':item_url(item)}

          final={x.get('name'):x for x in attachments()}
          if set(final)!=set(files): raise SystemExit(f'Final Gitee asset set mismatch: {sorted(final)}')
          Path('gitee-publication.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Gitee v1.16.0 has exactly two publicly hash-verified ZIP assets.')

      - uses: actions/upload-artifact@v4
        with:
          name: v1160-gitee-publication-evidence
          path: gitee-publication.json
          retention-days: 30

      - name: Remove one-shot publication workflow
        if: success()
        run: |
          git rm .github/workflows/publish-v1160-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: clean one-shot v1.16 publication workflow'
          git push origin HEAD:release/v1.16.0-docs
