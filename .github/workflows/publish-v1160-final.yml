name: Publish verified FlyPPTTimer v1.16.0

on:
  push:
    branches: [release/v1.16.0-docs]
    paths: [.github/workflows/publish-v1160-final.yml]

permissions:
  contents: write

concurrency:
  group: publish-v1160-final
  cancel-in-progress: false

env:
  VERSION: '1.16.0'
  PUBLIC_MAIN_SHA: 'dbbeef7c8224040aae62b85fd2bfd856027ed430'
  PRODUCT_SOURCE_SHA: '6adb4a14c3eb4ea8292a76355282050877254297'
  PUBLIC_DOCS_SHA: '3578d63c4e866cabd99e403e7ffcb29eae7ceb85'
  TRANSFER_SHA256: '0ac08ea80498709b611da394f60f7ebaf001709390003b1eaa01fe1bf3075cf3'
  TRANSFER_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-85a4-8211-9435-838d7f65385a/raw?se=2026-09-17T16%3A00%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=d8cc8732-8905-524c-ac45-afaa5265503e&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T02%3A01%3A13Z&ske=2026-09-18T02%3A01%3A13Z&sks=b&skv=2026-02-06&sig=DXYkMU2qJmpHwnHDqZT%2BzX53TtdlSKG%2B4yKH572un/4%3D'
  GITEE_OWNER: 'hona-cao'
  GITEE_REPO: 'fly-ppttimer'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard final public state
        shell: bash
        run: |
          set -euo pipefail
          actual=$(gh api repos/Hona-Cao/FlyPPTTimer/commits/main --jq .sha)
          [ "$actual" = "$PUBLIC_MAIN_SHA" ] || { echo "Unexpected public main: $actual" >&2; exit 1; }
          test -n "$GITEE_TOKEN" || { echo 'GITEE_TOKEN is unavailable' >&2; exit 1; }
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "v$VERSION already exists" >&2; exit 1; } || true
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION tag already exists unexpectedly" >&2
            exit 1
          fi

      - name: Download short-lived verified package Artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$TRANSFER_URL" -o transfer.zip
          echo "$TRANSFER_SHA256  transfer.zip" | sha256sum --check
          mkdir transfer release-assets
          unzip -q transfer.zip -d transfer
          find transfer -maxdepth 4 -type f -print

      - name: Verify package identity and exact asset bytes
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path('transfer')
          identities=list(root.rglob('package-identity.json'))
          if len(identities)!=1: raise SystemExit(f'Expected one package identity, got {len(identities)}')
          identity=json.loads(identities[0].read_text(encoding='utf-8'))
          if identity.get('version')!=os.environ['VERSION']: raise SystemExit('Version identity mismatch')
          if identity.get('product_source')!=os.environ['PRODUCT_SOURCE_SHA']: raise SystemExit('Product source mismatch')
          if identity.get('public_docs')!=os.environ['PUBLIC_DOCS_SHA']: raise SystemExit('Public docs identity mismatch')
          expected={
              f"FlyPPTTimer-v{os.environ['VERSION']}-portable-win-x64.zip",
              f"FlyPPTTimer-v{os.environ['VERSION']}-setup-win-x64.zip",
          }
          found={p.name:p for p in root.rglob('*.zip')}
          if set(found)!=expected: raise SystemExit(f'Unexpected release assets: {sorted(found)}')
          for name,path in found.items():
              if not zipfile.is_zipfile(path): raise SystemExit(f'Invalid ZIP: {name}')
              record=identity['assets'][name]
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              if digest!=record['sha256'] or path.stat().st_size!=record['size']:
                  raise SystemExit(f'Identity mismatch: {name}')
              shutil.copy2(path,Path('release-assets')/name)
          shutil.copy2(identities[0],Path('release-assets/package-identity.json'))
          print(json.dumps(identity,indent=2))

      - name: Publish GitHub Release with exactly two ZIP assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -maxdepth 1 -name '*.zip' -type f | sort)
          [ "${#files[@]}" -eq 2 ] || { echo 'Expected exactly two ZIP assets' >&2; exit 1; }
          gh release create "v$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$PUBLIC_MAIN_SHA" \
            --title "FlyPPTTimer v$VERSION" \
            --notes-file docs/RELEASE_NOTES_v1.16.0.md \
            --latest
          release=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url,assets)
          echo "$release" > github-release.json
          python - <<'PY'
          import json,os
          r=json.load(open('github-release.json',encoding='utf-8'))
          expected={f"FlyPPTTimer-v{os.environ['VERSION']}-portable-win-x64.zip",f"FlyPPTTimer-v{os.environ['VERSION']}-setup-win-x64.zip"}
          names={x['name'] for x in r['assets']}
          if r['isDraft'] or r['isPrerelease'] or r['tagName']!='v'+os.environ['VERSION'] or names!=expected:
              raise SystemExit(f'GitHub release verification failed: {r}')
          print(r['url'])
          PY

      - name: Re-download GitHub Release assets and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir github-verify
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir github-verify --pattern '*.zip'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          identity=json.loads(Path('release-assets/package-identity.json').read_text(encoding='utf-8'))
          found={p.name:p for p in Path('github-verify').glob('*.zip')}
          if set(found)!=set(identity['assets']): raise SystemExit('GitHub re-download asset set mismatch')
          for name,p in found.items():
              rec=identity['assets'][name]
              if p.stat().st_size!=rec['size'] or hashlib.sha256(p.read_bytes()).hexdigest()!=rec['sha256']:
                  raise SystemExit(f'GitHub re-download hash mismatch: {name}')
          print('GitHub Release asset hashes verified.')
          PY

      - name: Install Gitee synchronization dependency
        run: python -m pip install 'requests>=2.32,<3'

      - name: Push release tag and publish identical assets to Gitee
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess,tempfile,time
          import requests

          version=os.environ['VERSION']; tag='v'+version
          owner=os.environ['GITEE_OWNER']; repo=os.environ['GITEE_REPO']; token=os.environ['GITEE_TOKEN']
          main_sha=os.environ['PUBLIC_MAIN_SHA']
          identity=json.loads(Path('release-assets/package-identity.json').read_text(encoding='utf-8'))
          files={p.name:p for p in Path('release-assets').glob('*.zip')}
          expected=set(identity['assets'])
          if set(files)!=expected or len(files)!=2: raise SystemExit('Local Gitee asset set mismatch')

          # Push the exact public GitHub release commit as the Gitee tag; never force a differing tag.
          with tempfile.TemporaryDirectory() as td:
              askpass=Path(td)/'askpass.py'
              askpass.write_text('#!/usr/bin/env python3\nimport os,sys\nprint(os.environ["GITEE_OWNER"] if "username" in sys.argv[1].lower() else os.environ["GITEE_TOKEN"])\n',encoding='utf-8')
              askpass.chmod(0o700)
              env=dict(os.environ,GIT_ASKPASS=str(askpass),GIT_TERMINAL_PROMPT='0')
              pushed=subprocess.run(['git','-c','credential.helper=','push',f'https://gitee.com/{owner}/{repo}.git',f'{main_sha}:refs/tags/{tag}'],env=env,capture_output=True,text=True,timeout=120)
              if pushed.returncode:
                  # Accept only an already-existing tag that resolves to the same SHA through the API below.
                  print(pushed.stderr[-500:])

          api=f'https://gitee.com/api/v5/repos/{owner}/{repo}'
          s=requests.Session(); s.headers.update({'Authorization':f'Bearer {token}','User-Agent':'FlyPPTTimer-v116-release'})
          def req(method,suffix,missing_ok=False,**kw):
              r=s.request(method,api+suffix,timeout=(15,180),**kw)
              if missing_ok and r.status_code==404: return None
              r.raise_for_status(); return r.json() if r.content else None

          commit=req('GET',f'/commits/{tag}',missing_ok=True)
          if commit is not None:
              got=commit.get('sha') or commit.get('id')
              if got and got!=main_sha: raise SystemExit(f'Gitee tag points to unexpected commit: {got}')

          notes=Path('docs/RELEASE_NOTES_v1.16.0.md').read_text(encoding='utf-8')
          payload={'tag_name':tag,'name':f'FlyPPTTimer {tag}','body':notes,'target_commitish':main_sha,'prerelease':False}
          release=req('GET',f'/releases/tags/{tag}',missing_ok=True)
          if release:
              release=req('PATCH',f"/releases/{release['id']}",json=payload)
          else:
              release=req('POST','/releases',json=payload)
          rid=release['id']; endpoint=f'/releases/{rid}/attach_files'

          for item in req('GET',endpoint) or []:
              if item.get('id'): req('DELETE',f"{endpoint}/{item['id']}")
          for name,path in sorted(files.items()):
              print(f'Uploading {name} to Gitee...',flush=True)
              with path.open('rb') as f:
                  r=s.post(api+endpoint,files={'file':(name,f,'application/zip')},timeout=(300,300))
              r.raise_for_status()

          attached=req('GET',endpoint) or []
          by_name={x.get('name'):x for x in attached}
          if set(by_name)!=expected: raise SystemExit(f'Gitee asset set mismatch: {sorted(by_name)}')
          evidence={'tag':tag,'github_main':main_sha,'product_source':os.environ['PRODUCT_SOURCE_SHA'],'public_docs':os.environ['PUBLIC_DOCS_SHA'],'assets':{}}
          for name,path in sorted(files.items()):
              rec=identity['assets'][name]
              item=by_name[name]
              size=item.get('size') or item.get('file_size')
              if size is not None and int(size)!=rec['size']: raise SystemExit(f'Gitee size mismatch: {name}')
              url=item.get('browser_download_url') or item.get('download_url')
              if url and url.startswith('/'): url='https://gitee.com'+url
              if not url: raise SystemExit(f'Gitee public URL missing: {name}')
              got=None
              for attempt in range(4):
                  try:
                      rr=requests.get(url,timeout=(15,240)); rr.raise_for_status()
                      got=hashlib.sha256(rr.content).hexdigest()
                      if got==rec['sha256']: break
                  except requests.RequestException as exc:
                      print(f'Public verify retry {attempt+1} for {name}: {exc}',flush=True)
                  time.sleep(5*(attempt+1))
              if got!=rec['sha256']: raise SystemExit(f'Gitee public digest mismatch: {name}')
              evidence['assets'][name]={'sha256':rec['sha256'],'size':rec['size'],'url':url}
          Path('gitee-publication.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Gitee Release asset hashes verified.')

      - name: Record publication evidence
        shell: python
        run: |
          from pathlib import Path
          import json
          github=json.loads(Path('github-release.json').read_text(encoding='utf-8'))
          gitee=json.loads(Path('gitee-publication.json').read_text(encoding='utf-8'))
          identity=json.loads(Path('release-assets/package-identity.json').read_text(encoding='utf-8'))
          out={'github':github,'gitee':gitee,'identity':identity}
          Path('publication-evidence.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - uses: actions/upload-artifact@v4
        with:
          name: v1160-publication-evidence
          path: publication-evidence.json
          retention-days: 30

      - name: Remove one-shot publication workflow
        if: success()
        run: |
          git rm .github/workflows/publish-v1160-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: clean one-shot v1.16 publication workflow'
          git push origin HEAD:release/v1.16.0-docs
