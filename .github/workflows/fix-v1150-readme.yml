name: Correct v1.15.0 README wording
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-v1150-readme.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct bilingual README wording
        shell: python
        run: |
          from pathlib import Path
          replacements={
            'README.zh-CN.md':[
              ('[v1.15.0 新用法](#v1141)','[v1.14.1 新用法](#v1141)'),
              ('以下下载均为 **v1.15.0**：直接发布之前已交付的便携版和安装版 ZIP，没有重新编译或重新打包。网上图文教程已更新；为保持安装包原样，包内文档保留构建时的版本。','以下下载均为 **v1.15.0**。本版便携版与安装版由同一份已通过验证的 v1.15.0 可执行文件打包；包内 README、完整教程与当前图文说明均对应 v1.15.0。'),
            ],
            'README.md':[
              ('[v1.15.0 workflow](#v1141)','[v1.14.1 workflow](#v1141)'),
              ('Both downloads provide **v1.15.0**: the exact previously delivered portable/setup ZIPs, without rebuilding or repackaging. Online guides are current; documentation inside the unchanged archives reflects their original build.','Both downloads provide **v1.15.0**. The portable and setup editions are packaged from the same validated v1.15.0 executable, and their bundled README, detailed guides, and current illustrations all describe v1.15.0.'),
            ],
          }
          for name,pairs in replacements.items():
            p=Path(name);s=p.read_text(encoding='utf-8')
            for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'{name}: expected exactly one match for {old!r}')
              s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit correction and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-v1150-readme.yml
          git add README.md README.zh-CN.md
          git diff --cached --check
          git commit -m 'docs: correct v1.15.0 package and history wording'
          git push origin HEAD:main
