name: Update v1.16.0 public guides

on:
  push:
    branches: [release/v1.16.0-docs]
    paths: [.github/workflows/update-v1160-guides.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update bilingual guides
        shell: python
        run: |
          from pathlib import Path
          import re

          en=Path('docs/USER_GUIDE.en.md')
          s=en.read_text(encoding='utf-8')
          s=s.replace('For **v1.15.0 public release / Windows 10 and 11 x64**.', 'For **v1.16.0 public release / Windows 10 and 11 x64**.', 1)
          section='''<a id="v1160"></a>\n## v1.16.0 workflow improvements\n\n- **Scenarios:** use **Save mode** in the Settings footer to name and save the currently applied configuration. Rows are newest-first and collapsed by default; select, confirm deletion, or expand them directly. Expanded details keep name, switch hotkey, badge color, and snapshot-update controls. The footer shows the active scenario and switching briefly highlights the timer border with its color.\n- **Presentation opener:** Windows system default remains the default. You can explicitly select a validated Microsoft PowerPoint or WPS Presentation executable; desktop and phone-initiated opens use the same preference.\n- **Phone Remote:** Exit presentation application is available whenever a known PowerPoint/WPS presentation process is running, even with no deck open. Controlled-deck checks and confirmation remain. Remote polling/dispatch intervals are reduced for quicker LAN feedback.\n\n'''
          marker='<a id="v1150"></a>\n## v1.15.0 complete feature guide'
          if marker not in s: raise SystemExit('English v1.15 section marker missing')
          s=s.replace(marker,section+marker,1)
          pattern=r'\*\*Create:\*\*.*?\n\n\*\*Maintain:\*\*.*?\n\n\*\*Switch:\*\*.*?(?=\n\n)'
          replacement='''**Save:** configure and Apply the working state first, then use **Save mode** in the Settings footer. Enter a name and confirm (or press Enter). New scenarios appear newest first and collapsed by default.\n\n**Maintain:** expand a row to rename it, assign a global switch hotkey, change its badge color, or overwrite the saved snapshot from the current configuration. Delete from the row itself and confirm; deleting a scenario never deletes PPT files.\n\n**Switch:** select a scenario from its row, its global hotkey, the tray/timer scenario submenu, or the phone Timer page. The footer shows the active scenario and color; the timer border briefly uses that color after a switch, and the application/tray badge dot is larger. The scenario submenu remains present even when no scenarios are saved.'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'English scenario workflow replacement count={n}')
          en.write_text(s,encoding='utf-8',newline='\n')

          zh=Path('docs/USER_GUIDE.zh-CN.md')
          s=zh.read_text(encoding='utf-8')
          s=s.replace('教程对应 **v1.15.0 正式版 · Windows 10 / 11 x64**。', '教程对应 **v1.16.0 正式版 · Windows 10 / 11 x64**。', 1)
          s=s.replace('[v1.15.0 新功能](#v1150)', '[v1.16.0 改进](#v1160) · [v1.15.0 新功能](#v1150)', 1)
          section='''<a id="v1160"></a>\n## v1.16.0 操作改进\n\n- **情景模式：**在设置底栏使用“保存模式”，填写名称并确认（或按 Enter），即可保存当前已经应用的整套配置。列表按最新创建优先且默认折叠；可直接在列表行选择、确认删除或展开。展开后维护名称、切换快捷键、角标颜色以及“用当前配置覆盖”。底栏显示当前情景与颜色，切换后计时器边框会短暂以该颜色提示。\n- **演示文稿打开方式：**默认继续使用 Windows 系统关联；也可明确指定经过验证的 Microsoft PowerPoint 或 WPS 演示可执行文件。电脑端与手机端打开文稿使用同一设置。\n- **手机 Remote：**只要已知 PowerPoint/WPS 演示程序仍在运行，即使当前没有打开文稿，也可以使用“退出演示程序”；受控文稿检查与确认仍保留。Remote 轮询与命令分发间隔缩短，局域网反馈更快。\n\n'''
          marker='<a id="v1150"></a>'
          if marker not in s: raise SystemExit('Chinese v1.15 section marker missing')
          s=s.replace(marker,section+marker,1)
          pattern=r'\*\*创建：\*\*.*?\n\n\*\*维护：\*\*.*?\n\n\*\*切换：\*\*.*?(?=\n\n)'
          replacement='''**保存：**先在其他页面把当前工作方式调好并应用，再在设置底栏使用“保存模式”。输入名称后确认或按 Enter，新情景会按最新创建优先显示，并默认折叠。\n\n**维护：**展开某一行后可重命名、分配全局切换快捷键、修改角标颜色，或用当前配置覆盖已有快照；删除直接在列表行操作并再次确认，删除情景不会删除 PPT 文件。\n\n**切换：**可直接选择情景列表行，也可使用情景快捷键、托盘/计时器右键菜单或手机“计时”页。底栏显示当前情景与颜色；切换后计时器边框会短暂显示该颜色，程序/托盘图标的情景色圆点也更醒目。即使还没有保存情景，右键菜单仍保留情景入口。'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Chinese scenario workflow replacement count={n}')
          zh.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit guide updates and remove one-shot workflow
        run: |
          git rm .github/workflows/update-v1160-guides.yml
          git add docs/USER_GUIDE.en.md docs/USER_GUIDE.zh-CN.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update bilingual guide for v1.16.0 workflows'
          git push origin HEAD:release/v1.16.0-docs
