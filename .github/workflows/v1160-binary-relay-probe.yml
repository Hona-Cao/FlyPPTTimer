name: Probe temporary binary relay

on:
  push:
    branches: [release/v1.16.0-docs]
    paths: [.github/workflows/v1160-binary-relay-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify temporary relay with harmless bytes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          printf 'FlyPPTTimer v1.16 relay probe\n' > probe.txt
          want=$(sha256sum probe.txt | awk '{print $1}')
          url=$(curl --fail --silent --show-error -F 'reqtype=fileupload' -F 'time=1h' -F 'fileToUpload=@probe.txt;type=text/plain' https://litterbox.catbox.moe/resources/internals/api.php)
          case "$url" in https://*) ;; *) echo 'LITTERBOX_TRANSFER=no'; exit 1;; esac
          curl --fail --silent --show-error --location "$url" -o received.txt
          got=$(sha256sum received.txt | awk '{print $1}')
          if [ "$got" != "$want" ]; then echo 'LITTERBOX_TRANSFER=no'; exit 1; fi
          echo 'LITTERBOX_TRANSFER=yes'
      - name: Remove one-shot probe
        run: |
          git rm .github/workflows/v1160-binary-relay-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove temporary binary relay probe'
          git push origin HEAD:release/v1.16.0-docs
