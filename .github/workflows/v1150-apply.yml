name: Apply v1.15.0 product patch

on:
  push:
    branches: [release/v1.15.0]
    paths: [.github/workflows/v1150-apply.yml]

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: '1.92.0'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.15.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and apply reviewed product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, subprocess
          chunks=[Path(f'.github/v1150-product-{i:02}.b64') for i in range(3)]
          data=''.join(p.read_text().strip() for p in chunks)
          patch=lzma.decompress(base64.b64decode(data))
          subprocess.run(['git','apply','--whitespace=nowarn','-'],input=patch,check=True)
          for p in chunks: p.unlink()
          PY
      - name: Basic source checks
        run: |
          node --check src/FlyPPTTimer/Web/app.js
          git diff --check
      - name: Commit product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement v1.15.0 scenarios, unlimited timing and automatic updates'
          git push origin HEAD:release/v1.15.0

  windows-validation:
    needs: apply
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: release/v1.15.0
          fetch-depth: 0
      - name: Install pinned Rust and Windows resource compiler
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed' }
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter rc.exe -Recurse | Where-Object FullName -Match '\\x64\\rc.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'Windows rc.exe not found' }
          $rc.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1150-windows-1.92-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            v1150-windows-1.92-${{ hashFiles('Cargo.lock') }}-
            rust-windows-1.92-${{ hashFiles('Cargo.lock') }}-
      - name: Format, lint, tests and web syntax
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Format check failed' }
          cargo clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          cargo test --locked 2>&1 | Tee-Object artifacts/ci/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          node --check src/FlyPPTTimer/Web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Web syntax failed' }
      - name: Release build and version
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $exe='target/release/FlyPPTTimer.exe'
          $version=(Get-Item $exe).VersionInfo.ProductVersion
          if ($version -ne '1.15.0') { throw "Unexpected ProductVersion: $version" }
          Copy-Item $exe artifacts/ci/FlyPPTTimer.exe
          Get-ChildItem target/release/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts/ci
          git rev-parse HEAD | Set-Content artifacts/ci/SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1150-first-validation
          path: artifacts/ci/**
          retention-days: 14
