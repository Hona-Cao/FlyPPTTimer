name: Mirror stable GitHub Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub Release tag to retry, for example v1.15.0
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true
  # Releases created with GITHUB_TOKEN do not always cascade another workflow.
  # Hourly reconciliation keeps the mirror self-healing even in that case.
  schedule:
    - cron: '17 * * * *'
  # A mirror implementation change immediately reconciles the latest stable
  # release, so repairing the sync never requires a one-off workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-gitee-release.yml'
      - 'scripts/sync-gitee-release.py'

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: hona-cao
      GITEE_REPO: fly-ppttimer
      REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GITHUB_ASSET_WAIT_SECONDS: '240'
      GITHUB_ASSET_POLL_SECONDS: '10'
      GITEE_UPLOAD_ATTEMPTS: '2'
      GITEE_UPLOAD_MAX_SECONDS: '180'
      GITEE_ATTACHMENT_POLL_SECONDS: '60'
      GITEE_PUBLIC_VERIFY_ATTEMPTS: '2'
      GITEE_PUBLIC_VERIFY_MAX_SECONDS: '90'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve stable release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No stable semantic-version Release is available to mirror." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Mirroring $tag"

      - name: Install sync dependency
        run: python -m pip install 'requests>=2.32,<3'

      - name: Mirror release notes and two ZIP assets to Gitee
        run: python scripts/sync-gitee-release.py "${{ steps.release.outputs.tag }}"

      - name: Preserve synchronization evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitee-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication/**
          if-no-files-found: ignore
          retention-days: 30
