name: Sync Release to Gitee
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag, for example v1.14.1
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: sync-gitee-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: hona-cao
      GITEE_REPO: fly-ppttimer
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Synchronize release and its two ZIP attachments
        run: python scripts/sync-gitee-release.py "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitee-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication/**
          if-no-files-found: ignore
          retention-days: 14
