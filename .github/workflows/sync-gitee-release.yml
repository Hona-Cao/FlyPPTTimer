name: Mirror stable GitHub Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub Release tag to retry, for example v1.14.1
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: hona-cao
      GITEE_REPO: fly-ppttimer
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GITHUB_ASSET_WAIT_SECONDS: '240'
      GITHUB_ASSET_POLL_SECONDS: '10'
      GITEE_UPLOAD_ATTEMPTS: '3'
      GITEE_PUBLIC_VERIFY_ATTEMPTS: '6'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sync dependency
        run: python -m pip install 'requests>=2.32,<3'

      - name: Mirror release notes and two ZIP assets to Gitee
        run: python scripts/sync-gitee-release.py "$RELEASE_TAG"

      - name: Preserve synchronization evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitee-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication/**
          if-no-files-found: ignore
          retention-days: 30
