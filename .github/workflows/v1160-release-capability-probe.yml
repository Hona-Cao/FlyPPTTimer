name: Probe v1.16 release transfer capabilities

on:
  push:
    branches: [release/v1.16.0-docs]
    paths: [.github/workflows/v1160-release-capability-probe.yml]

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe capabilities without exposing credentials
        shell: bash
        run: |
          set +e
          if [ -n "$GITEE_TOKEN" ]; then echo 'GITEE_SECRET_AVAILABLE=yes'; else echo 'GITEE_SECRET_AVAILABLE=no'; fi
          gh api repos/Hona-Cao/FlyPPTTimer-Dev >/dev/null 2>&1
          if [ $? -eq 0 ]; then echo 'PRIVATE_DEV_READ_AVAILABLE=yes'; else echo 'PRIVATE_DEV_READ_AVAILABLE=no'; fi
          exit 0
      - name: Remove one-shot probe
        run: |
          git rm .github/workflows/v1160-release-capability-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove v1.16 release capability probe'
          git push origin HEAD:release/v1.16.0-docs
