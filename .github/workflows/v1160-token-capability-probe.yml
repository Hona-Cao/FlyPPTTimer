name: Probe cross-repo release token availability

on:
  push:
    branches: [release/v1.16.0-docs]
    paths: [.github/workflows/v1160-token-capability-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      DEV_REPO_TOKEN: ${{ secrets.DEV_REPO_TOKEN }}
      PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      PAT: ${{ secrets.PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe candidate token scopes without printing secrets
        shell: bash
        run: |
          set +e
          for name in GH_PAT GITHUB_PAT RELEASE_TOKEN PRIVATE_REPO_TOKEN DEV_REPO_TOKEN PUBLIC_REPO_TOKEN PAT; do
            token="${!name}"
            if [ -z "$token" ]; then
              echo "$name=absent"
              continue
            fi
            GH_TOKEN="$token" gh api repos/Hona-Cao/FlyPPTTimer-Dev >/dev/null 2>&1
            if [ $? -eq 0 ]; then echo "$name=private-read-ok"; else echo "$name=present-no-private-read"; fi
          done
          exit 0
      - name: Remove one-shot probe
        run: |
          git rm .github/workflows/v1160-token-capability-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove cross-repo release token probe'
          git push origin HEAD:release/v1.16.0-docs
