name: v1.14.0 documentation GUI
on:
  push:
    branches: [release/v1.14.0]
    paths: [.github/workflows/docs-v1140.yml]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Documentation renderer toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain setup failed' }
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter rc.exe -Recurse | Where-Object FullName -Match '\\x64\\rc.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          $rc.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1140-doc-captures-${{ github.run_id }}
          restore-keys: v1140-windows-1.92-
      - name: Build disposable CJK documentation renderer
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile doc-font.otf
          python scripts/prepare-doc-capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Documentation font preparation failed' }
          python -c "from pathlib import Path; p=Path('src/capture.rs'); s=p.read_text(encoding='utf-8').replace('PhysicalSize::new(900, 650)', 'PhysicalSize::new(900, 800)'); p.write_text(s, encoding='utf-8', newline='\n')"
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Documentation renderer failed' }
      - name: Capture current settings, timers, Remote and update notes
        run: |
          foreach ($theme in @('light','dark')) {
            $env:FLYPPT_CAPTURE_THEME = $theme
            foreach ($mode in @('settings','windows')) {
              $out = Join-Path $PWD "gui-captures/$theme/$mode"
              New-Item -ItemType Directory -Force $out | Out-Null
              $p = Start-Process target/release/FlyPPTTimer.exe -ArgumentList @("--capture-$mode", $out) -Wait -PassThru -RedirectStandardOutput "$out/stdout.log" -RedirectStandardError "$out/stderr.log"
              if ($p.ExitCode -ne 0) { throw "Capture failed: $theme/$mode" }
            }
          }
      - name: Remove documentation-only changes
        if: always()
        run: |
          git restore src/capture.rs ui/app-window.slint
          Remove-Item doc-font.otf -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: v1140-doc-captures
          path: gui-captures/**
          retention-days: 14
