name: Windows CI
on:
  push:
    branches: [main, publish/v1.13.1]
    paths:
      - "src/**"
      - "ui/**"
      - "resources/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust and Windows SDK
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter rc.exe -Recurse | Where-Object FullName -Match '\\x64\\rc.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          $rc.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-windows-1.92-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-windows-1.92-${{ hashFiles('Cargo.lock') }}-
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Format check failed' }
          cargo clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Regression tests and web syntax
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          cargo test --locked 2>&1 | Tee-Object artifacts/ci/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          node --check src/FlyPPTTimer/Web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Web syntax check failed' }
      - name: Release build
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ci-logs
          path: artifacts/ci/*.log
          retention-days: 14
