name: Package validated FlyPPTTimer v1.14.1
on:
  push:
    branches: [review/v1.14.1]
    paths: [.github/workflows/package-v1141.yml]
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm the runtime was validated before the documentation-only failure
        run: |
          $jobs=gh api repos/Hona-Cao/FlyPPTTimer/actions/runs/34990592629/jobs | ConvertFrom-Json
          foreach ($name in @('Formatting and lint','Regression tests and web syntax','Build v1.14.1','Capture real authorization page and compact timer','Startup and remote permission smoke','Run actions/cache/save@v4')) {
            $step=$jobs.jobs[0].steps | Where-Object name -eq $name
            if ($step.conclusion -ne 'success') { throw "Missing validated build step: $name" }
          }
          git diff --exit-code 9027fb386f4080179f832ebfe11b665ee96ee665 -- Cargo.toml Cargo.lock src ui resources build.rs .github/v1141-0.b64 .github/v1141-1.b64 .github/v1141-fix.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime inputs differ from the validated run' }
      - uses: actions/download-artifact@v4
        with:
          name: v1141-evidence
          run-id: 34990592629
          github-token: ${{ github.token }}
          path: artifacts/evidence
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1141-windows-1.92-34990592629
          fail-on-cache-miss: true
      - name: Reproduce the validated source and fix only documentation line endings
        shell: python
        run: |
          from pathlib import Path
          import base64,lzma,subprocess
          parts=[Path(f'.github/v1141-{i}.b64') for i in range(2)]
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          subprocess.run(['git','apply','--whitespace=nowarn','-'],input=patch,check=True)
          for p in parts:p.unlink()
          subprocess.run(['python','.github/v1141-fix.py'],check=True)
          Path('docs/v1/HANDOFF.md').write_text('''# v1.14.1 completed follow-up

          Branch: review/v1.14.1. Main and public release tags are unchanged. Deliver portable and setup ZIPs; do not create a public release for this follow-up without a further request.

          A new authenticated phone connection opens Settings at Remote control with a highlighted PPT file-browsing permission and Apply instructions. It never grants permission automatically, preserves draft edits, and does not repeat on polling or reconnection during the service session. The existing permission still applies to devices holding the current Remote URL.

          The timer keeps its font sizes and fixed left/right metadata arrangement. Row gap is 0 DIP, metadata separation 4 DIP, horizontal padding totals 12 DIP and vertical padding totals 4 DIP. Manual width/height remains unchanged.

          Anchor placement and drag capture use actual window dimensions and full monitor bounds instead of a fixed 140x50 baseline. Top-center at zero aligns the real top edge; bottom-center aligns the real bottom edge. All nine anchors follow the same rule, including negative-origin screens and different DPI. Saved nonzero offsets are retained.

          Validation run 34990592629: formatting, Clippy, 102 passed / 0 failed / 3 ignored, web syntax, optimized Windows build, real GUI captures and startup/Remote checks passed. Only its subsequent commit step failed because generated Markdown used CRLF. The exact cached executable is reused here without rebuilding or changing runtime inputs. Source is reconstructed from the identical patch and fixes and formatted with the same Rust 1.92.0 toolchain. Documentation is written with LF.

          Package/source identity is in BUILD.txt and SOURCE.txt. Automated validation and software GUI renders are not physical phone/Office acceptance. This packaging workflow is the completed delivery record.
          '''.replace('\n          ','\n').rstrip()+'\n',encoding='utf-8',newline='\n')
          Path('docs/v1/CODEX_TASK.md').write_text('''# v1.14.1 follow-up completed

          Connection guidance, compact readout and real zero-offset screen-edge behavior are implemented and validated. See HANDOFF.md and RELEASE_NOTES_v1.14.1.md. Preserve main and existing public releases. Await new feedback; do not rerun earlier RC patches or publication tasks.
          '''.replace('\n          ','\n').rstrip()+'\n',encoding='utf-8',newline='\n')
      - name: Format the identical source and check cached application version
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Formatter installation failed' }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          if ((Get-Item target/release/FlyPPTTimer.exe).VersionInfo.ProductVersion -ne '1.14.1') { throw 'Wrong cached executable' }
          'Reused the exact optimized application from validation run 34990592629. No runtime code or compiler inputs changed after that validation.' | Set-Content artifacts/evidence/package-provenance.txt
          Get-FileHash target/release/FlyPPTTimer.exe | Format-List | Out-File artifacts/evidence/package-provenance.txt -Append
      - name: Commit the product and delivery notes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src ui resources scripts docs
          git add -u .github
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Source whitespace check failed' }
          git commit -m 'fix: guide phone authorization, tighten timer spacing and use actual screen-edge anchors'
          if ($LASTEXITCODE -ne 0) { throw 'Product commit failed' }
          git push origin HEAD:refs/heads/review/v1.14.1
          if ($LASTEXITCODE -ne 0) { throw 'Product push failed' }
          git rev-parse HEAD | Set-Content artifacts/evidence/SOURCE.txt
          git archive --format=zip --output=artifacts/evidence/product-source.zip HEAD
      - name: Build portable and installer ZIPs from the unchanged executable
        run: |
          $env:PRODUCT_SOURCE_SHA=(git rev-parse HEAD).Trim()
          & scripts/build-release.ps1 -ApplicationDirectory target/release
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: FlyPPTTimer-v1.14.1-packages
          path: artifacts/release/v1.14.1/*.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1141-final-evidence
          path: artifacts/evidence/**
          retention-days: 14
